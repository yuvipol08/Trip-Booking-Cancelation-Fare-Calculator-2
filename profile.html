<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TravelEase — My Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="index.html"><span class="logo-icon">🌿</span><span class="logo-text">TravelEase</span></a>
    <nav class="main-nav" id="mainNav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="booking.html">Book a Trip</a>
      <a class="nav-link" href="bookings.html">My Bookings</a>
      <a class="nav-link" href="profile.html">Profile</a>
    </nav>
    <div class="header-right">
      <div id="authArea"></div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<main>
  <div class="page-head">
    <p class="eyebrow">Your account</p>
    <h1>Profile</h1>
  </div>

  <div class="profile-layout">
    <div class="profile-sidebar">
      <div class="profile-card">
        <div class="profile-avatar" id="profileAvatar">?</div>
        <div class="profile-name" id="profileName">Traveller</div>
        <div class="profile-city" id="profileEmail">—</div>
      </div>
      <div class="green-score" id="profileGreen" hidden></div>
    </div>

    <div class="profile-main">
      <div class="profile-card">
        <h3 class="card-title">Your details</h3>
        <form id="profileForm">
          <div class="form-stack">
            <label class="field">
              <span class="field-label">Full name</span>
              <input type="text" id="pName" placeholder="e.g. Rahul Sharma" />
            </label>
            <label class="field">
              <span class="field-label">Email (cannot be changed)</span>
              <input type="email" id="pEmail" disabled />
            </label>
            <label class="field">
              <span class="field-label">Phone number</span>
              <input type="tel" id="pPhone" placeholder="10-digit mobile number" />
            </label>
            <label class="field">
              <span class="field-label">Gender</span>
              <select id="pGender">
                <option value="">-- Select --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Home city</span>
              <select id="pCity"><option value="">-- Select city --</option></select>
            </label>
            <label class="field">
              <span class="field-label">Address</span>
              <textarea id="pAddress" rows="3" placeholder="House no, street, area..."></textarea>
            </label>
          </div>
          <button type="submit" class="btn btn-primary">Save details</button>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="logo-text">🌿 TravelEase</span>
    <p>© <span id="year"></span> TravelEase. A student project.</p>
    <div class="footer-links"><a href="bookings.html">My Bookings</a></div>
  </div>
</footer>

<script src="auth.js"></script>
<script src="data.js"></script>
<script src="profile.js"></script>
</body>
</html>
